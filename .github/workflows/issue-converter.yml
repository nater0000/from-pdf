name: Issue PDF Converter

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies & Build llama.cpp
        run: |
          pip install .
          sudo apt-get install -y zip cmake
          
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          cmake -B build
          cmake --build build --config Release -j 4 --target llama-server
          sudo cp build/bin/llama-server /usr/local/bin/
          sudo chmod +x /usr/local/bin/llama-server

      - name: Extract PDF URL and Download
        id: extract
        run: |
          PDF_URL=$(echo "${{ github.event.issue.body }}" | grep -oP 'https://github\.com/user-attachments/(files|assets)/[^)]+\.pdf' | head -n 1)
          if [ -z "$PDF_URL" ]; then
            echo "No PDF found in the issue body."
            exit 1
          fi
          curl -L -o document.pdf "$PDF_URL"

      - name: Convert PDF (Corrupted Text Layer for Styling)
        run: |
          rm -rf conversions/issue-${{ github.event.issue.number }}
          mkdir -p conversions/issue-${{ github.event.issue.number }}/corrupted
          marker_single document.pdf --output_dir conversions/issue-${{ github.event.issue.number }}/corrupted --mode fast --disable_ocr --page_range 1-5

      - name: Convert PDF (Fixed Visual OCR for Clean Spacing)
        run: |
          mkdir -p conversions/issue-${{ github.event.issue.number }}/fixed
          marker_single document.pdf --output_dir conversions/issue-${{ github.event.issue.number }}/fixed --mode fast --force_ocr --debug --page_range 1-5

      - name: Fuzzy Align Formatting via Gemini
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          cat << 'EOF' > align_formatting.py
          import sys
          from pathlib import Path
          from google import genai
          
          def fuzzy_llm_merge(corrupted_path, clean_path, output_path):
              print(f"-> Loading corrupted formatted text: {corrupted_path}")
              with open(corrupted_path, 'r', encoding='utf-8') as f:
                  corr_text = f.read()
                  
              print(f"-> Loading clean OCR text: {clean_path}")
              with open(clean_path, 'r', encoding='utf-8') as f:
                  clean_text = f.read()
                  
              print("-> Sending dual-input alignment prompt to Gemini 3.6 Flash...")
              client = genai.Client()
              
              prompt = f"""You are a precise fuzzy-matching text alignment engine. 
              You will receive two versions of a document. 
              1. CORRUPTED TEXT: Contains correct markdown formatting (**bold**, *italics*, etc.) but broken character spacing.
              2. CLEAN OCR TEXT: Has perfect spelling and natural spacing, but lacks formatting.
              
              Task: Map the markdown formatting tags from the CORRUPTED text onto the CLEAN OCR text. 
              The CLEAN OCR TEXT is the absolute source of truth for spelling, line breaks, and spaces. 
              Do not summarize or alter the clean text; only inject the formatting tags into their correct positions.
              
              --- CORRUPTED TEXT ---
              {corr_text}
              
              --- CLEAN OCR TEXT ---
              {clean_text}
              """
              
              response = client.models.generate_content(
                  model='gemini-3.6-flash',
                  contents=prompt
              )
              
              print(f"-> Saving perfectly aligned markdown to: {output_path}")
              with open(output_path, 'w', encoding='utf-8') as f:
                  f.write(response.text)
                  
          if __name__ == "__main__":
              issue_num = sys.argv[1]
              corrupted_md = Path(f"conversions/issue-{issue_num}/corrupted/document/document.md")
              clean_md = Path(f"conversions/issue-{issue_num}/fixed/document/document.md")
              output_md = Path(f"conversions/issue-{issue_num}/document_aligned.md")
              
              if corrupted_md.exists() and clean_md.exists():
                  fuzzy_llm_merge(corrupted_md, clean_md, output_md)
                  print("✅ Dual-input alignment complete.")
              else:
                  print("❌ Missing input files. Alignment aborted.")
          EOF
          
          python align_formatting.py ${{ github.event.issue.number }}

      - name: Create Comprehensive Archive
        run: |
          cd conversions/issue-${{ github.event.issue.number }}
          zip -r aligned_output.zip document_aligned.md corrupted/ fixed/ ../../align_formatting.py

      - name: Commit Generated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add conversions/issue-${{ github.event.issue.number }}/
          git commit -m "Auto-generate aligned markdown for issue #${{ github.event.issue.number }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Post Direct Download Links
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNum = context.issue.number;
            
            const rawMdUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/conversions/issue-${issueNum}/document_aligned.md`;
            const rawZipUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/conversions/issue-${issueNum}/aligned_output.zip`;
            
            await github.rest.issues.createComment({
              issue_number: issueNum,
              owner: owner,
              repo: repo,
              body: `✅ **Alignment Complete (Pages 1-5)!**\n\nThe LLM has fuzzy-matched the formatting to the clean OCR text. All intermediate logs and files are in the zip.\n\n📄 **Aligned MD Only:** [Download Raw Markdown](${rawMdUrl})\n📦 **Debug Archive (All Files):** [Download Zip](${rawZipUrl})`
            });
