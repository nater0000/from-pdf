name: Issue PDF Converter

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Tools and Build llama.cpp
        run: |
          pip install .
          sudo apt-get install -y zip cmake
          
          # Build standalone llama-server natively using CMake
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          cmake -B build
          cmake --build build --config Release -j 4 --target llama-server
          sudo cp build/bin/llama-server /usr/local/bin/
          sudo chmod +x /usr/local/bin/llama-server

      - name: Extract PDF URL and Download
        id: extract
        run: |
          PDF_URL=$(echo "${{ github.event.issue.body }}" | grep -oP 'https://github\.com/user-attachments/(files|assets)/[^)]+\.pdf' | head -n 1)
          if [ -z "$PDF_URL" ]; then
            echo "No PDF found in the issue body."
            exit 1
          fi
          curl -L -o document.pdf "$PDF_URL"

      - name: Convert PDF (Corrupted Text Layer)
        run: |
          mkdir -p conversions/issue-${{ github.event.issue.number }}/corrupted
          # --disable_ocr forces the fast, corrupted text-layer extraction
          marker_single document.pdf --output_dir conversions/issue-${{ github.event.issue.number }}/corrupted --mode fast --disable_ocr --page_range 1-5

      - name: Convert PDF (Fixed Visual OCR)
        run: |
          mkdir -p conversions/issue-${{ github.event.issue.number }}/fixed
          # --force_ocr forces the slower, accurate visual reading
          marker_single document.pdf --output_dir conversions/issue-${{ github.event.issue.number }}/fixed --mode fast --force_ocr --page_range 1-5

      - name: Create Comparison Archive
        run: |
          cd conversions/issue-${{ github.event.issue.number }}
          # Zips both the corrupted and fixed folders together
          zip -r comparison_archive.zip corrupted/ fixed/

      - name: Commit Generated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add conversions/issue-${{ github.event.issue.number }}/
          git commit -m "Auto-generate comparison for issue #${{ github.event.issue.number }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Post Direct Download Links
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNum = context.issue.number;
            
            const rawCorruptedUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/conversions/issue-${issueNum}/corrupted/document/document.md`;
            const rawFixedUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/conversions/issue-${issueNum}/fixed/document/document.md`;
            const rawZipUrl = `https://raw.githubusercontent.com/${owner}/${repo}/main/conversions/issue-${issueNum}/comparison_archive.zip`;
            
            await github.rest.issues.createComment({
              issue_number: issueNum,
              owner: owner,
              repo: repo,
              body: `✅ **Comparison Complete (Pages 1-5)!**\n\n📄 **Corrupted Text Layer:** [Download .md](${rawCorruptedUrl})\n📄 **Fixed Visual OCR:** [Download .md](${rawFixedUrl})\n📦 **Both Versions + Images:** [Download .zip](${rawZipUrl})`
            });
            
            await github.rest.issues.update({
              issue_number: issueNum,
              owner: owner,
              repo: repo,
              state: 'closed'
            });
