name: Scheduled Storage Cleanup

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Find and Remove Old Conversions
        run: |
          OLD_DIRS=$(find conversions/ -mindepth 1 -maxdepth 1 -type d -mtime +30 2>/dev/null || true)
          
          if [ -n "$OLD_DIRS" ]; then
            for dir in $OLD_DIRS; do
              echo "Removing $dir"
              git rm -r "$dir"
            done
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Automated cleanup: Removed conversions older than 30 days [skip ci]"
            git push
          else
            echo "No outdated conversions found."
          fi
